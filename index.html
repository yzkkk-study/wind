<style>
:root{
  color-scheme:light;
  --canvas:#f2f3f5;
  --surface:#ffffff;
  --surface-muted:#f8f9fa;
  --surface-dark:#111214;
  --surface-dark-raised:#191a1b;
  --ink:#17181a;
  --ink-muted:#62666d;
  --ink-on-dark:#f7f8f8;
  --line:#e1e3e6;
  --line-dark:#2a2c30;
  --accent:#0b806b;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
button{border:0;background:none;color:inherit;font:inherit;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.topbar{display:flex;min-height:54px;background:var(--surface-dark);border-bottom:1px solid var(--line-dark)}
.header{display:flex;align-items:center;gap:10px;min-width:208px;padding:0 18px;color:var(--ink-on-dark);font-size:16px;font-weight:600;white-space:nowrap}
.brand-mark{width:4px;height:22px;border-radius:2px;background:var(--accent)}
.nav{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{position:relative;display:flex;flex-shrink:0;align-items:center;min-width:68px;min-height:53px;padding:0 18px;cursor:pointer;color:#9fa4ad;font-size:14px;font-weight:500;justify-content:center;white-space:nowrap}
.nav-item:hover{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active{color:var(--ink-on-dark);background:var(--surface-dark-raised)}
.nav-item.active::after{content:'';position:absolute;right:14px;bottom:0;left:14px;height:2px;background:var(--accent)}
.category-nav{display:flex;align-items:center;gap:4px;min-height:42px;padding:5px 18px;overflow-x:auto;background:var(--surface-muted);border-bottom:1px solid var(--line);scrollbar-width:none}
.category-nav[hidden]{display:none}
.category-nav::-webkit-scrollbar{display:none}
.category-item{min-height:32px;padding:6px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;font-weight:500;border:1px solid transparent;border-radius:var(--radius);white-space:nowrap;text-align:center}
.category-item:hover{color:var(--ink);background:#eef0f2}
.category-item.active{color:var(--ink);background:var(--surface);border-color:var(--line)}
.main{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:208px;min-width:208px;padding:10px 8px;overflow-y:auto;background:var(--surface-muted);border-right:1px solid var(--line)}
.side-item{display:block;width:100%;min-height:38px;padding:9px 12px;cursor:pointer;color:var(--ink-muted);font-size:13px;border:1px solid transparent;border-radius:var(--radius)}
.side-item:hover{color:var(--ink);background:#eef0f2}
.side-item.active{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 var(--accent)}
.content{flex:1;min-width:0;overflow:hidden;padding:12px}
.chart-wrap{width:100%;height:100%}
.chart-grid{overflow-y:auto;overflow-x:hidden;scrollbar-color:#c5c8ce transparent;scrollbar-width:thin}
.chart-cell{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(17,18,20,.04)}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
@media (max-width:720px){
  .topbar{min-height:48px}
  .header{min-width:144px;padding:0 12px;font-size:14px}
  .brand-mark{height:18px}
  .nav-item{min-width:58px;min-height:47px;padding:0 12px;font-size:13px}
  .category-nav{min-height:40px;padding:4px 8px}
  .main{flex-direction:column}
  .sidebar{display:flex;width:100%;min-width:0;min-height:48px;padding:5px 8px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .side-item{width:auto;min-width:max-content;min-height:38px;padding:9px 12px;text-align:center}
  .side-item.active{box-shadow:inset 0 -3px var(--accent)}
  .content{padding:8px}
}
</style>
</head>

const STATE_KEY = 'windDashboardStateV5';
let currentModule = 0;
let currentCategory = 0;
let currentGroup = 0;
let currentGroups = [];
function clampIndex(value, length){
  const n=Number.isInteger(value)?value:parseInt(value,10);
  if(!length){return 0;}
  return Number.isFinite(n)?Math.max(0,Math.min(length-1,n)):0;
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(STATE_KEY)||'{}');}
  catch(e){return {};}
}
function saveState(){
  localStorage.setItem(STATE_KEY,JSON.stringify({module:currentModule,category:currentCategory,group:currentGroup}));
}
function buildNav(){
  const nav=document.getElementById('navBar');
  MODULES.forEach((m,i)=>{const d=document.createElement('button');d.type='button';d.className='nav-item';d.textContent=m.name;d.onclick=()=>selectModule(i,0,0);nav.appendChild(d);});
  const state=loadState();
  selectModule(clampIndex(state.module,MODULES.length),state.category,state.group);
}
function selectModule(i,categoryIndex=0,groupIndex=0){
  currentModule=i;
  document.querySelectorAll('.nav-item').forEach((e,j)=>{e.classList.toggle('active',j===i);e.setAttribute('aria-current',j===i?'page':'false');});
  const module=MODULES[i], categories=module.categories||[], nav=document.getElementById('categoryNav');
  nav.innerHTML='';
  if(categories.length){
    nav.hidden=false;
    categories.forEach((category,j)=>{const d=document.createElement('button');d.type='button';d.className='category-item';d.textContent=category.name;d.onclick=()=>selectCategory(j,0);nav.appendChild(d);});
    selectCategory(clampIndex(categoryIndex,categories.length),groupIndex);
    return;
  }
  nav.hidden=true;
  currentCategory=0;
  selectGroups(module.groups||[],groupIndex);
}
function selectCategory(j,groupIndex=0){
  currentCategory=j;
  document.querySelectorAll('.category-item').forEach((e,k)=>{e.classList.toggle('active',k===j);e.setAttribute('aria-current',k===j?'page':'false');});
  selectGroups((MODULES[currentModule].categories[j]||{}).groups||[],groupIndex);
}
function selectGroups(groups,groupIndex=0){
  currentGroups=groups;
  const activeGroup=clampIndex(groupIndex,groups.length);
  renderSidebar(groups,activeGroup);
  if(groups.length){selectGroup(activeGroup, groups);} else {currentGroup=0;renderChart(null);saveState();}
}
function renderSidebar(groups,activeIndex){
  const side=document.getElementById('sidebar'); side.innerHTML='';
  groups.forEach((g,k)=>{const d=document.createElement('button');d.type='button';d.className='side-item'+(k===activeIndex?' active':'');d.textContent=g.name;d.setAttribute('aria-current',k===activeIndex?'page':'false');d.onclick=()=>selectGroup(k, groups);side.appendChild(d);});
  requestAnimationFrame(()=>{
    const active=side.children[activeIndex];
    if(!active){return;}
    if(getComputedStyle(side).display==='flex'){
      side.scrollLeft=Math.max(0,active.offsetLeft-(side.clientWidth-active.clientWidth)/2);
    }else{
      side.scrollTop=Math.max(0,active.offsetTop-(side.clientHeight-active.clientHeight)/2);
    }
  });
}
function selectGroup(k, groups=currentGroups){
  currentGroup=k;
  currentGroups=groups;
  document.querySelectorAll('.side-item').forEach((e,i)=>{e.classList.toggle('active',i===k);e.setAttribute('aria-current',i===k?'page':'false');});
  renderChart(chartData[groups[k].id]);
  saveState();
}
function renderChart(cfg){
  const wrap=document.getElementById('chartWrap'); wrap.innerHTML='';
  if(!cfg){wrap.innerHTML='<div class="empty">该模块图表待确认</div>';return;}
  let charts=[];
  if(cfg.charts){charts=cfg.charts.filter(c=>c&&c.data&&c.data.length);}
  else if(cfg.data){charts=[cfg];}
  if(!charts.length){wrap.innerHTML='<div class="empty">该图组暂无可用数据</div>';return;}
  const content=document.getElementById('contentWrap'), rect=content.getBoundingClientRect(), style=getComputedStyle(content);
  const cw=Math.floor(rect.width-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight));
  const ch=Math.floor(rect.height-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom));
  const cols=cw<720?1:(cw<1120?2:3), visibleRows=2;
  const gap=8, gridPad=4, cellW=Math.floor((cw-gridPad-gap*(cols-1))/cols), cellH=Math.max(260,Math.floor((ch-gap*(visibleRows-1))/visibleRows));
  const grid=document.createElement('div');
  grid.className='chart-grid';
  grid.style.cssText='display:grid;grid-template-columns:repeat('+cols+','+cellW+'px);gap:'+gap+'px;width:'+cw+'px;max-height:'+ch+'px;padding-right:'+gridPad+'px;';
  charts.forEach((_,i)=>{const c=document.createElement('div');c.id='chart_'+i;c.className='chart-cell';c.style.cssText='width:'+cellW+'px;height:'+cellH+'px;';grid.appendChild(c);});
  wrap.appendChild(grid);
  setTimeout(()=>charts.forEach((c,i)=>{
    const lo=JSON.parse(JSON.stringify(c.layout||{}));
    lo.width=cellW;
    lo.height=cellH;
    if(cols===1){
      const margin=lo.margin={...(lo.margin||{}),t:30,b:90};
      const plotH=Math.max(1,cellH-(margin.t||0)-(margin.b||0));
      lo.font={...(lo.font||{}),size:9};
      if(lo.title&&typeof lo.title==='object')lo.title.font={...(lo.title.font||{}),size:12};
      if(lo.xaxis)lo.xaxis.tickfont={...(lo.xaxis.tickfont||{}),size:9};
      if(lo.yaxis)lo.yaxis.tickfont={...(lo.yaxis.tickfont||{}),size:9};
      if(lo.yaxis2)lo.yaxis2.tickfont={...(lo.yaxis2.tickfont||{}),size:9};
      if(lo.legend){
        lo.legend.font={...(lo.legend.font||{}),size:9};
        lo.legend.y=(74-(margin.b||0))/plotH;
        lo.legend.yanchor='top';
      }
      (lo.annotations||[]).forEach(a=>{
        a.font={...(a.font||{}),size:8};
        if(typeof a.text==='string'&&a.text.startsWith('数据来源:')){
          a.y=(8-(margin.b||0))/plotH;
          a.yanchor='bottom';
        }
      });
    }
    Plotly.newPlot('chart_'+i,c.data,lo,{displayModeBar:false,responsive:true});
  }),60);
}
window.addEventListener('resize',()=>{if(currentGroups.length){renderChart(chartData[currentGroups[currentGroup].id]);}else{renderChart(null);}});
